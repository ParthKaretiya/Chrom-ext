<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Area Blur</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="heading">
      <div class="logo">◌</div>
      <div>
        <h1>WhatsApp Area Blur</h1>
        <p>Choose what others can see.</p>
      </div>
    </div>
    <button id="select" class="primary">＋ Select area to blur</button>
    <button id="toggle" class="secondary">Hide / show blur</button>
    <button id="clear" class="danger">Clear all blur areas</button>
    <p id="status" role="status">Open WhatsApp Web to get started.</p>
    <p class="tip">Tip: drag over a name, message, photo, or any part of the page.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
